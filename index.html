<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0f0f0f"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <title>PPL Tracker</title>
  <link rel="manifest" href="manifest.json"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f0f;color:#f0f0f0;min-height:100vh;padding:16px;padding-bottom:80px}
    h1{font-size:20px;font-weight:500}
    h2{font-size:17px;font-weight:500}
    p{line-height:1.5}
    button{font-family:inherit;cursor:pointer}
    input,select,textarea{font-family:inherit}
    #app{max-width:500px;margin:0 auto}
    .btn{display:block;width:100%;padding:10px 16px;background:transparent;border:1px solid #333;border-radius:10px;color:#f0f0f0;font-size:14px;font-weight:500;text-align:left}
    .btn:active{opacity:.7}
    .btn-green{background:#1D9E75;border-color:#1D9E75;color:#fff;text-align:center;padding:13px}
    .btn-sm{padding:6px 10px;font-size:12px;width:auto}
    .btn-chip{padding:4px 10px;font-size:12px;width:auto;border-radius:8px}
    .btn-chip.active{background:#1a1a1a}
    .btn-icon{background:none;border:none;color:#888;font-size:20px;line-height:1;padding:0}
    .card{border:1px solid #222;border-radius:12px;padding:12px 14px;margin-bottom:10px}
    .tag{display:inline-block;font-size:11px;color:#888;background:#1a1a1a;border-radius:4px;padding:1px 6px;margin-right:4px;margin-top:3px}
    .metric{background:#1a1a1a;border-radius:10px;padding:12px 14px}
    .metric-label{font-size:12px;color:#888;margin-bottom:4px}
    .metric-val{font-size:22px;font-weight:500}
    .metric-unit{font-size:13px;font-weight:400}
    input[type=number],input[type=text],select,textarea{background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#f0f0f0;padding:6px 8px;font-size:13px;width:100%}
    textarea{resize:vertical}
    .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
    .row{display:flex;gap:8px;align-items:center}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .set-row{display:grid;grid-template-columns:24px 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
    .set-label{font-size:11px;color:#888}
    .warmup{background:#1a1a1a;border-radius:10px;padding:10px 14px;margin-bottom:14px;border:1px solid #222}
    .warmup p{font-size:12px;color:#ccc;margin:2px 0}
    .pr{font-size:9px;background:#FAC775;color:#412402;border-radius:4px;padding:2px 4px;font-weight:500}
    .add-panel{border:1px solid #2a2a2a;border-radius:12px;padding:14px;margin-top:10px;background:#111}
    .add-panel label{font-size:12px;color:#888;display:block;margin-bottom:4px;margin-top:10px}
    .add-panel label:first-child{margin-top:0}
    code{font-size:12px;background:#1a1a1a;padding:1px 5px;border-radius:4px;color:#aaa}
    .swap-panel{background:#111;border:1px solid #2a2a2a;border-radius:10px;padding:12px;margin-top:8px}
    .swap-panel p{font-size:12px;color:#888;margin-bottom:4px}
    .swap-grid{display:flex;flex-wrap:wrap;gap:6px}
    #timer-bar{position:fixed;bottom:0;left:0;right:0;background:#0f0f0f;border-top:1px solid #1e1e1e;padding:10px 16px;z-index:100}
    #timer-bar-inner{max-width:500px;margin:0 auto;display:flex;align-items:center;gap:10px}
    #tbar-label{font-size:13px;color:#888;min-width:36px}
    .tbar-presets{display:flex;gap:4px}
    .tbar-presets button{font-size:11px;padding:4px 7px;background:transparent;border:1px solid #333;border-radius:6px;color:#f0f0f0;font-family:inherit;cursor:pointer}
    .tbar-presets button.active{background:#252525;border-color:#555}
    #tbar-start{font-size:12px;padding:5px 12px;background:transparent;border:1px solid #1D9E75;border-radius:8px;color:#1D9E75;font-family:inherit}
    #tbar-reset{font-size:12px;padding:5px 10px;background:transparent;border:1px solid #333;border-radius:8px;color:#888;font-family:inherit}
    svg text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  </style>
</head>
<body>
<div id="app"></div>

<div id="timer-bar">
  <div id="timer-bar-inner">
    <svg width="32" height="32">
      <circle cx="16" cy="16" r="13" fill="none" stroke="#222" stroke-width="3"/>
      <circle id="tbar-arc" cx="16" cy="16" r="13" fill="none" stroke="#1D9E75" stroke-width="3"
        stroke-dasharray="81.7" stroke-dashoffset="0" stroke-linecap="round"
        transform="rotate(-90 16 16)" style="transition:stroke-dashoffset 1s linear"/>
    </svg>
    <span id="tbar-label">2:00</span>
    <div class="tbar-presets">
      <button onclick="setTimerDur(120)" class="active">120s</button>
      <button onclick="setTimerDur(180)">180s</button>
      <button onclick="setTimerDur(240)">240s</button>
      <button onclick="setTimerDur(300)">300s</button>
    </div>
    <button id="tbar-start" onclick="toggleTimer()">Start</button>
    <button id="tbar-reset" onclick="resetTimer()">Reset</button>
  </div>
</div>

<script>
const DEFAULT_PROGRAMME = {
  "Push A":[
    {name:"Incline Dumbbell Press",target:"3×10–12",weight:"22.5 kg",note:"Upper chest — hold 22.5 until 3×12 clean"},
    {name:"Decline Chest Press Machine",target:"3×12",weight:"40–42.5 kg",note:"Ready to nudge up"},
    {name:"Machine Fly",target:"3×12–15",weight:"50–52.5 kg",note:"Feel the stretch at bottom"},
    {name:"Dumbbell Side Lateral Raise",target:"3×15",weight:"10 kg",note:"Slight forward lean, lead with elbow"},
    {name:"Close-Grip DB Bench Press",target:"3×12",weight:"15–17.5 kg",note:"Tricep-emphasis press, elbows tucked"},
    {name:"Cable Tricep Pushdown",target:"2×12",weight:"25 kg",note:"Isolation finisher"},
    {name:"Cable/Machine Crunch",target:"3×20",weight:"25–39 kg",note:"Abs — 3×/week only"},
  ],
  "Pull A":[
    {name:"Chin-Up Pull",target:"3×10",weight:"BW or +5 kg",note:"Retract scapula at top; log reps"},
    {name:"Cable Row",target:"3×12",weight:"50–54 kg",note:"Pause 1 sec at chest, no swing"},
    {name:"Single-Arm Lat Pulldown",target:"3×12",weight:"32.5–35 kg",note:"Full stretch at top"},
    {name:"Rear Delt Fly (Cable)",target:"3×15",weight:"",note:"Cbum style. Bent down go light"},
    {name:"Incline DB Curl",target:"3×12",weight:"15 kg",note:"Long head / peak builder"},
    {name:"Barbell Reverse Grip Curl",target:"2×12",weight:"20 kg",note:"Brachialis + forearm (covers pronation)"},
    {name:"Sit Up",target:"3×15",weight:"",note:""},
  ],
  "Legs A":[
    {name:"Sumo Squat",target:"3×12",weight:"",note:""},
    {name:"V Squat Machine",target:"3×12",weight:"",note:""},
    {name:"RDL",target:"3×12",weight:"20–25 kg",note:"Hip hinge, feel hamstring stretch"},
    {name:"Leg Press",target:"4×12",weight:"85–95 kg",note:"Feet shoulder-width, full depth"},
    {name:"Leg Extension",target:"3×15",weight:"75 kg",note:"Log weight every session"},
    {name:"Adduction Machine",target:"3×15",weight:"22.5+3.75 kg",note:"Slow eccentric, inner thigh focus"},
    {name:"Standing Calf Raise",target:"3×20",weight:"BW+10 kg",note:"10 sec rest between sets, full ROM"},
  ],
  "Pump A":[
    {name:"Overhead Cable Tricep Extension",target:"3×12",weight:"",note:"Long head focus — slow eccentric, full stretch, 2RIR"},
    {name:"EZ Bar Skull Crusher",target:"3×12",weight:"",note:"Control descent, stop 2 reps before failure"},
    {name:"Cable Front Delt Raise",target:"3×15",weight:"5–7.5 kg",note:"Strict form, feel the front delt — not momentum"},
    {name:"Barbell Wrist Curl",target:"3×20",weight:"",note:"Forearm flexors — full ROM, slow"},
    {name:"Barbell Behind Wrist Curl",target:"3×20",weight:"",note:"Forearm extensors — controlled, don't rush"},
  ],
  "Push B":[
    {name:"Neutral Grip Shoulder Press",target:"3×12",weight:"",note:"Primary overhead — delts"},
    {name:"Neutral Grip DB Press",target:"3×12",weight:"",note:"Chest press"},
    {name:"Dumbbell Side Lateral Raise",target:"3×15",weight:"8–10 kg",note:"Consistent with Push A"},
    {name:"Machine Fly",target:"3×15",weight:"",note:"Seat further lean back, chest stretch"},
    {name:"Tricep Pushdown",target:"3×13",weight:"",note:"W Bar"},
    {name:"Single Arm Cable Overhead Extension",target:"2×15",weight:"",note:"Long head"},
    {name:"Abs Crunch",target:"3×15",weight:"",note:""},
  ],
  "Pull B":[
    {name:"Cable Lat Pull Down",target:"3×12",weight:"50–60 kg",note:""},
    {name:"Barbell Bent-Over Row",target:"3×12",weight:"15–17.5 kg",note:"Hinge, elbows back not flared"},
    {name:"Half Kneeling Single Cable Row",target:"3×12",weight:"",note:"Lat detail, full stretch"},
    {name:"Rear Delt Fly (sideways)",target:"3×15",weight:"42.5–45 kg",note:"Consistent with Pull A weight"},
    {name:"Cross DB Hammer Curl",target:"3×12",weight:"",note:"Brachialis, 1-up-1-down tempo"},
    {name:"Cable Curl",target:"2×15",weight:"",note:"Constant tension, no slack at bottom"},
    {name:"Sit Up",target:"3×15",weight:"",note:""},
  ],
  "Legs B":[
    {name:"Lying Leg Curl",target:"3×12",weight:"27.5–30 kg",note:"Hamstring focus, control the drop"},
    {name:"Linear Hack Squat",target:"3×10",weight:"40–45 kg",note:"Own movement, not a lighter squat"},
    {name:"Leg Press",target:"4×12",weight:"90–100 kg",note:"Progressive — aim +2.5 kg/week"},
    {name:"Glute-Ham Raise / Nordic Curl",target:"3×15",weight:"BW or +5 kg",note:"Full ROM, slow eccentric"},
    {name:"Bulgarian Split Squat",target:"3×12/leg",weight:"2×8 kg DBs",note:"Glute/quad shaper"},
    {name:"Adduction",target:"3×15",weight:"",note:""},
    {name:"Standing Calf Raise",target:"3×20",weight:"+10–15 kg",note:"Log weight every session"},
  ],
  "Pump B":[
    {name:"Incline DB Curl",target:"3×12",weight:"12.5–15 kg",note:"Peak builder — full stretch at bottom, squeeze at top, 2RIR"},
    {name:"Cable Curl",target:"3×15",weight:"",note:"Constant tension — don't let cable go slack at bottom"},
    {name:"Cross DB Hammer Curl",target:"3×12",weight:"",note:"Brachialis focus — controlled, 1 up 1 down tempo"},
    {name:"Rear Delt Fly (Cable)",target:"3×15",weight:"",note:"Go light — Cbum style, bent over, thumbs down, feel the squeeze"},
    {name:"Wrist Pronation",target:"3×20",weight:"7–8 kg",note:"Forearm on pad, controlled rotation"},
  ],
};

const WARMUPS={
  "Pull A":[{name:"Face Pull",sets:"2×15",weight:"20 kg",note:"Elbows high"},{name:"Cable External Rotation",sets:"2×15",weight:"light"}],
  "Push B":[{name:"Face Pull",sets:"2×20",weight:"20 kg",note:"Elbows high"},{name:"Cable External Rotation",sets:"2×15",weight:"light"}],
  "Pull B":[{name:"Face Pull",sets:"2×15",weight:"light"}],
  "Pump A":[{name:"Band Pull-Apart or Face Pull",sets:"2×20",weight:"light",note:"Warm up rotator cuff before overhead work"}],
  "Pump B":[{name:"Band Pull-Apart or Face Pull",sets:"2×20",weight:"light",note:"Warm up rear delt before curls"}],
};

const DAYS=["Push A","Pull A","Legs A","Pump A","Push B","Pull B","Legs B","Pump B"];
const DAY_TYPE={"Push A":"Push","Pull A":"Pull","Legs A":"Legs","Pump A":"Pump","Push B":"Push","Pull B":"Pull","Legs B":"Legs","Pump B":"Pump"};
const DAY_COLOR={Push:"#1D9E75",Pull:"#378ADD",Legs:"#D85A30",Pump:"#9B59B6"};
const SIBLING={"Push A":"Push B","Push B":"Push A","Pull A":"Pull B","Pull B":"Pull A","Legs A":"Legs B","Legs B":"Legs A","Pump A":"Pump B","Pump B":"Pump A"};

// Always merge saved programme with default to pick up new days
const savedProg=JSON.parse(localStorage.getItem("ppl_programme")||"null");
let PROGRAMME=savedProg?Object.assign(JSON.parse(JSON.stringify(DEFAULT_PROGRAMME)),savedProg):JSON.parse(JSON.stringify(DEFAULT_PROGRAMME));

let sessions=JSON.parse(localStorage.getItem("ppl_sessions")||"[]");
let currentSession=JSON.parse(localStorage.getItem("ppl_current")||"null");
let view=currentSession?"session":"home";
let historyFilter="All";
let progressEx="";
let editMode=false;
let showAddPanel=null;
let swapIdx=null;
let showCustomSwap=false;
let showExPicker=false;

function save(){localStorage.setItem("ppl_sessions",JSON.stringify(sessions));}
function saveProg(){localStorage.setItem("ppl_programme",JSON.stringify(PROGRAMME));}
function saveCurrent(){localStorage.setItem("ppl_current",JSON.stringify(currentSession));}
function clearCurrent(){localStorage.removeItem("ppl_current");}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function fmt(iso){return new Date(iso).toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"});}

function getPR(name){
  let b=null;
  for(const s of sessions) for(const e of s.exercises) if(e.name===name) for(const st of e.sets){const w=parseFloat(st.weight)||0;if(!b||w>b)b=w;}
  return b;
}
function getLastSessions(name){
  const res=[];
  for(const s of sessions){
    const ex=s.exercises.find(e=>e.name===name);
    if(ex){const sets=ex.sets.filter(st=>st.weight||st.reps);if(sets.length){res.push({date:s.date,sets,note:ex.note});if(res.length===2)break;}}
  }
  return res;
}
function getAllExercises(){
  const seen=new Set(),list=[];
  for(const day of DAYS) for(const ex of (PROGRAMME[day]||[])) if(!seen.has(ex.name)){seen.add(ex.name);list.push({...ex,day});}
  return list;
}

function render(){document.getElementById("app").innerHTML=views[view]();}

// ── Timer ──────────────────────────────────────────────────────────────────
let timerDur=120,timerRem=120,timerRunning=false,timerInterval=null;
const CIRC=81.7;
function updateTimerUI(){
  const pct=timerRem/timerDur;
  const arc=document.getElementById("tbar-arc");
  const lbl=document.getElementById("tbar-label");
  const btn=document.getElementById("tbar-start");
  if(arc)arc.style.strokeDashoffset=CIRC*(1-pct);
  const m=Math.floor(timerRem/60),s=String(timerRem%60).padStart(2,"0");
  if(lbl)lbl.textContent=`${m}:${s}`;
  if(btn)btn.textContent=timerRunning?"Pause":"Start";
}
function setTimerDur(s){
  timerDur=s;timerRem=s;timerRunning=false;clearInterval(timerInterval);
  document.querySelectorAll(".tbar-presets button").forEach(b=>b.classList.toggle("active",b.textContent===s+"s"));
  updateTimerUI();
}
function toggleTimer(){
  timerRunning=!timerRunning;
  if(timerRunning){timerInterval=setInterval(()=>{if(timerRem<=1){timerRem=0;timerRunning=false;clearInterval(timerInterval);}else timerRem--;updateTimerUI();},1000);}
  else clearInterval(timerInterval);
  updateTimerUI();
}
function resetTimer(){timerRunning=false;clearInterval(timerInterval);timerRem=timerDur;updateTimerUI();}

// ── Programme editing ──────────────────────────────────────────────────────
function removeProgExercise(day,idx){
  if(!confirm(`Remove "${PROGRAMME[day][idx].name}" from ${day}?`))return;
  PROGRAMME[day].splice(idx,1);saveProg();render();
}
function moveExercise(day,idx,dir){
  const arr=PROGRAMME[day],to=idx+dir;
  if(to<0||to>=arr.length)return;
  [arr[idx],arr[to]]=[arr[to],arr[idx]];
  saveProg();render();
}
function toggleAddPanel(day){showAddPanel=showAddPanel===day?null:day;render();}
function submitNewExercise(day){
  const name=document.getElementById("new-name").value.trim();
  const target=document.getElementById("new-target").value.trim();
  const weight=document.getElementById("new-weight").value.trim();
  const note=document.getElementById("new-note").value.trim();
  if(!name){alert("Exercise name is required.");return;}
  if(!PROGRAMME[day])PROGRAMME[day]=[];
  PROGRAMME[day].push({name,target:target||"",weight:weight||"",note:note||""});
  saveProg();showAddPanel=null;render();
}

// ── Session swap ───────────────────────────────────────────────────────────
function openSwap(ei){swapIdx=ei;showCustomSwap=false;render();setTimeout(()=>{const el=document.getElementById("swap-panel-"+ei);if(el)el.scrollIntoView({behavior:"smooth",block:"center"});},50);}
function closeSwap(){swapIdx=null;showCustomSwap=false;render();}
function doSwap(ei,name,target,weight,note){
  const old=currentSession.exercises[ei];
  currentSession.exercises[ei]={...old,name,target:target||old.target,suggestedWeight:weight||old.suggestedWeight,programNote:note||"",sets:[{weight:"",reps:""}],note:""};
  saveCurrent();swapIdx=null;showCustomSwap=false;render();
}
function submitCustomSwap(ei){
  const name=document.getElementById("cswap-name").value.trim();
  const target=document.getElementById("cswap-target").value.trim();
  const weight=document.getElementById("cswap-weight").value.trim();
  if(!name){alert("Exercise name is required.");return;}
  doSwap(ei,name,target,weight,"");
}

// ── Backup / Restore ───────────────────────────────────────────────────────
function exportData(){
  const data={sessions,programme:PROGRAMME,exported:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`ppl-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(url);
}
function importData(){
  const input=document.createElement("input");
  input.type="file";input.accept=".json";
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.sessions)throw new Error("Invalid");
        if(!confirm(`Merge ${data.sessions.length} sessions from backup?`))return;
        const ids=new Set(sessions.map(s=>s.id));
        const fresh=data.sessions.filter(s=>!ids.has(s.id));
        sessions=[...sessions,...fresh].sort((a,b)=>new Date(b.date)-new Date(a.date));
        save();
        if(data.programme&&confirm("Also restore programme from backup?")){
          // Merge saved programme with default so Pump A/B are never lost
          PROGRAMME=Object.assign(JSON.parse(JSON.stringify(DEFAULT_PROGRAMME)),data.programme);
          saveProg();
        }
        alert(`Done! ${fresh.length} new session(s) imported.`);render();
      }catch{alert("Could not read file.");}
    };
    reader.readAsText(file);
  };
  input.click();
}

// ── Views ──────────────────────────────────────────────────────────────────
const views={

  home(){
    const recent=sessions.slice(0,3).map(s=>`
      <div class="card row" style="justify-content:space-between">
        <div class="row" style="gap:10px">
          <span class="dot" style="background:${DAY_COLOR[DAY_TYPE[s.day]]||"#888"}"></span>
          <span style="font-weight:500;font-size:14px">${s.day}</span>
          <span style="font-size:12px;color:#888">${s.exercises.length} exercises</span>
        </div>
        <span style="font-size:12px;color:#888">${fmt(s.date)}</span>
      </div>`).join("");

    const dayRows=DAYS.map(d=>{
      const prog=PROGRAMME[d]||[];
      const exList=editMode?prog.map((ex,i)=>`
        <div style="display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #1a1a1a">
          <div style="display:flex;flex-direction:column;gap:2px;margin-right:2px">
            <button class="btn-icon" style="font-size:13px;line-height:1;opacity:${i===0?0.2:1}" onclick="moveExercise('${d}',${i},-1)" ${i===0?"disabled":""}>▲</button>
            <button class="btn-icon" style="font-size:13px;line-height:1;opacity:${i===prog.length-1?0.2:1}" onclick="moveExercise('${d}',${i},1)" ${i===prog.length-1?"disabled":""}>▼</button>
          </div>
          <span style="flex:1;font-size:13px">${ex.name}</span>
          <span class="tag">${ex.target}</span>
          <button class="btn-icon" style="font-size:16px;color:#a32d2d" onclick="removeProgExercise('${d}',${i})">×</button>
        </div>`).join(""):"";

      const addForm=(editMode&&showAddPanel===d)?`
        <div class="add-panel">
          <label>Exercise name *</label><input type="text" id="new-name" placeholder="e.g. Cable Fly"/>
          <label>Sets × reps</label><input type="text" id="new-target" placeholder="e.g. 3×12"/>
          <label>Weight / load</label><input type="text" id="new-weight" placeholder="e.g. 20–25 kg"/>
          <label>Note (optional)</label><input type="text" id="new-note" placeholder="e.g. slow eccentric"/>
          <div style="display:flex;gap:8px;margin-top:12px">
            <button class="btn btn-green" style="flex:1;padding:9px" onclick="submitNewExercise('${d}')">Add</button>
            <button class="btn" style="flex:1;padding:9px;text-align:center" onclick="toggleAddPanel('${d}')">Cancel</button>
          </div>
        </div>`:"";

      const addBtn=editMode?`<button class="btn btn-chip" style="margin-top:8px;color:#1D9E75;border-color:#1D9E75;width:100%;text-align:center" onclick="toggleAddPanel('${d}')">+ Add exercise</button>`:"";

      return editMode?`
        <div class="card" style="margin-bottom:8px">
          <div class="row" style="gap:12px">
            <span class="dot" style="background:${DAY_COLOR[DAY_TYPE[d]]}"></span>
            <span style="flex:1;font-weight:500">${d}</span>
            <span style="font-size:11px;color:#888">${prog.length} exercises</span>
          </div>
          <div style="margin-top:8px">${exList}</div>
          ${addForm}${addBtn}
        </div>`:
        `<button class="btn" style="display:flex;align-items:center;gap:12px;padding:13px 16px;margin-bottom:8px" onclick="startSession('${d}')">
          <span class="dot" style="background:${DAY_COLOR[DAY_TYPE[d]]}"></span>
          <span style="flex:1;font-weight:500">${d}</span>
          <span style="font-size:11px;color:#888">${prog.length} exercises</span>
          <span style="font-size:11px;color:#666">${sessions.filter(s=>s.day===d).length} logged</span>
        </button>`;
    }).join("");

    return `
      <div class="row" style="justify-content:space-between;margin-bottom:1.5rem">
        <h1>PPL Tracker</h1>
        <div class="row" style="gap:6px;flex-wrap:wrap">
          <button class="btn btn-sm" onclick="go('history')">History</button>
          <button class="btn btn-sm" onclick="go('progress')">Progress</button>
          <button class="btn btn-sm" onclick="go('backup')">Backup</button>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <p style="font-size:13px;color:#888">${editMode?"Editing programme":"Start a session"}</p>
        <button class="btn btn-chip ${editMode?"active":""}" onclick="editMode=!editMode;showAddPanel=null;render()">${editMode?"Done editing":"Edit programme"}</button>
      </div>
      ${currentSession&&!editMode?`
        <div class="card" style="border-color:#1D9E75;margin-bottom:14px">
          <p style="font-size:12px;color:#1D9E75;margin-bottom:6px;font-weight:500">Session in progress</p>
          <div class="row" style="justify-content:space-between">
            <div class="row" style="gap:8px">
              <span class="dot" style="background:${DAY_COLOR[DAY_TYPE[currentSession.day]]||"#888"}"></span>
              <span style="font-weight:500">${currentSession.day}</span>
              <span style="font-size:12px;color:#888">${currentSession.exercises.length} exercises</span>
            </div>
            <div class="row" style="gap:8px">
              <button class="btn btn-chip" onclick="go('session')">Resume</button>
              <button class="btn-icon" style="font-size:15px" onclick="if(confirm('Discard this session?')){clearCurrent();currentSession=null;render();}">×</button>
            </div>
          </div>
        </div>`:""}
      ${dayRows}
      ${!editMode&&sessions.length?`<p style="font-size:13px;color:#888;margin:1.5rem 0 8px">Recent</p>${recent}`:""}`;
  },

  session(){
    const s=currentSession;
    const wu=(WARMUPS[s.day]||[]).map(w=>`<p>${w.name} — ${w.sets} @ ${w.weight}${w.note?" · "+w.note:""}</p>`).join("");
    const siblingDay=SIBLING[s.day]||s.day;
    const dayProg=[...(PROGRAMME[s.day]||[]),...(PROGRAMME[siblingDay]||[])];

    const exHtml=s.exercises.map((ex,ei)=>{
      const pr=getPR(ex.name);
      const lastSessions=getLastSessions(ex.name);
      const lastHtml=lastSessions.length?lastSessions.map((ls,li)=>`
        <div style="background:#111;border-radius:8px;padding:7px 10px;margin-bottom:6px;border:1px solid #1a1a1a">
          <p style="font-size:11px;color:#555;margin-bottom:3px">${li===0?"Last":"Previous"} · ${fmt(ls.date)}</p>
          <p style="font-size:12px;color:#aaa">${ls.sets.map((st,si)=>`<span style="color:#666;font-size:10px">${si+1}.</span> ${st.weight||"?"}kg × ${st.reps||"?"}reps`).join(" &nbsp; ")}</p>
          ${ls.note?`<p style="font-size:11px;color:#555;font-style:italic;margin-top:3px">${ls.note}</p>`:""}
        </div>`).join("")
        :`<p style="font-size:11px;color:#444;margin-bottom:8px">No previous sessions</p>`;

      const sets=ex.sets.map((st,si)=>`
        <div class="set-row">
          <span style="font-size:12px;color:#888;text-align:center">${si+1}</span>
          <input type="number" placeholder="kg" value="${st.weight}" min="0" step="0.5" oninput="updateSet(${ei},${si},'weight',this.value)"/>
          <input type="number" placeholder="reps" value="${st.reps}" min="0" oninput="updateSet(${ei},${si},'reps',this.value)"/>
          <div class="row" style="gap:4px">
            ${pr!==null&&parseFloat(st.weight)>pr?'<span class="pr">PR</span>':""}
            <button class="btn-icon" onclick="removeSet(${ei},${si})">×</button>
          </div>
        </div>`).join("");

      const usedNames=s.exercises.map(e=>e.name);
      const swapOptions=dayProg.filter(p=>p.name!==ex.name&&!usedNames.includes(p.name));
      const swapPanel=swapIdx===ei?`
        <div class="swap-panel" id="swap-panel-${ei}">
          <p>Swap "${ex.name}" — today only</p>
          <p style="font-size:11px;color:#555;margin-bottom:8px">Exercises from ${s.day} & ${siblingDay}</p>
          <div class="swap-grid">
            ${swapOptions.map(p=>`<button class="btn btn-chip" onclick="doSwap(${ei},'${p.name.replace(/'/g,"\\'")}','${p.target}','${p.weight}','${p.note.replace(/'/g,"\\'")}'">${p.name}</button>`).join("")}
            <button class="btn btn-chip" style="border-color:#555;color:#ccc" onclick="showCustomSwap=true;render()">+ Custom</button>
          </div>
          ${showCustomSwap?`
            <div style="margin-top:10px">
              <input type="text" id="cswap-name" placeholder="Exercise name *" style="margin-bottom:6px"/>
              <input type="text" id="cswap-target" placeholder="Sets × reps (e.g. 3×12)" style="margin-bottom:6px"/>
              <input type="text" id="cswap-weight" placeholder="Weight (e.g. 20 kg)"/>
              <div style="display:flex;gap:8px;margin-top:10px">
                <button class="btn btn-green" style="flex:1;padding:8px" onclick="submitCustomSwap(${ei})">Swap</button>
                <button class="btn" style="flex:1;padding:8px;text-align:center" onclick="showCustomSwap=false;render()">Cancel</button>
              </div>
            </div>`:""}
          <button onclick="closeSwap()" style="background:none;border:none;color:#666;font-size:12px;cursor:pointer;margin-top:10px;display:block">Cancel</button>
        </div>`:"";

      return `
        <div class="card">
          <div class="row" style="justify-content:space-between;align-items:flex-start;margin-bottom:8px">
            <div style="flex:1">
              <span style="font-weight:500;font-size:14px">${ex.name}</span>
              ${ex.programNote?`<p style="font-size:11px;color:#555;font-style:italic;margin-top:3px">${ex.programNote}</p>`:""}
            </div>
            <div class="row" style="gap:8px;flex-shrink:0;margin-left:8px">
              <button class="btn-icon" style="font-size:13px;color:#555;border:1px solid #333;border-radius:6px;padding:3px 7px" onclick="openSwap(${ei})">swap</button>
              <button class="btn-icon" onclick="removeExercise(${ei})">×</button>
            </div>
          </div>
          ${swapPanel}
          ${swapIdx!==ei?`
          ${lastHtml}
          <div class="set-row" style="margin-bottom:4px">
            <span></span><span class="set-label">kg</span><span class="set-label">reps</span><span></span>
          </div>
          ${sets}
          <button class="btn btn-chip" style="margin-top:4px;font-size:12px;color:#888;text-align:center;width:100%" onclick="addSet(${ei})">+ Add set</button>
          <textarea placeholder="Session notes..." rows="1" style="margin-top:8px;font-size:12px" oninput="updateNote(${ei},this.value)">${ex.note}</textarea>
          ${pr?`<p style="font-size:11px;color:#666;margin-top:4px">All-time PR: ${pr} kg</p>`:""}
          `:""}
        </div>`;
    }).join("");

    const used=s.exercises.map(e=>e.name);
    const allEx=getAllExercises().filter(e=>!used.includes(e.name));
    const grouped=DAYS.map(d=>({day:d,exercises:allEx.filter(e=>e.day===d)})).filter(g=>g.exercises.length);
    const exPicker=showExPicker?`
      <div class="card" style="margin-bottom:12px">
        <div class="row" style="justify-content:space-between;margin-bottom:10px">
          <p style="font-size:13px;font-weight:500">Add exercise</p>
          <button class="btn-icon" style="font-size:16px" onclick="showExPicker=false;render()">×</button>
        </div>
        ${grouped.map(g=>`
          <p style="font-size:11px;color:#555;font-weight:500;margin-bottom:6px;margin-top:10px">${g.day}</p>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px">
            ${g.exercises.map(e=>`<button class="btn btn-chip" onclick="addExerciseToSession('${e.name.replace(/'/g,"\\'")}');showExPicker=false;">${e.name}</button>`).join("")}
          </div>`).join("")}
      </div>`:
      `<button class="btn btn-chip" style="margin-bottom:12px;width:100%;text-align:center;border-style:dashed" onclick="showExPicker=true;render()">+ Add exercise</button>`;

    return `
      <div class="row" style="justify-content:space-between;margin-bottom:1.25rem">
        <div class="row" style="gap:10px">
          <button class="btn-icon" onclick="go('home')">&#8592;</button>
          <div><h2>${s.day}</h2><span style="font-size:12px;color:#888">${fmt(s.date)}</span></div>
        </div>
      </div>
      ${wu?`<div class="warmup"><p style="font-weight:500;font-size:12px;color:#888;margin-bottom:6px">Warm-up (do first)</p>${wu}</div>`:""}
      ${exHtml}
      ${exPicker}
      <button class="btn btn-green" style="margin-bottom:1rem" onclick="finishSession()">Finish session</button>`;
  },

  history(){
    const filtered=historyFilter==="All"?sessions:sessions.filter(s=>s.day===historyFilter);
    const chips=["All",...DAYS].map(d=>`<button class="btn btn-chip ${historyFilter===d?"active":""}" onclick="setHistFilter('${d}')">${d}</button>`).join("");
    const rows=filtered.map(s=>`
      <div class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <div class="row" style="gap:8px">
            <span class="dot" style="background:${DAY_COLOR[DAY_TYPE[s.day]]||"#888"}"></span>
            <span style="font-weight:500;font-size:14px">${s.day}</span>
          </div>
          <div class="row" style="gap:10px">
            <span style="font-size:12px;color:#888">${fmt(s.date)}</span>
            <button class="btn-icon" style="font-size:16px" onclick="delSession('${s.id}')">×</button>
          </div>
        </div>
        ${s.exercises.map(ex=>`
          <div style="margin-bottom:5px">
            <span style="font-size:13px;font-weight:500">${ex.name}</span>
            <span style="font-size:12px;color:#888;margin-left:8px">${ex.sets.filter(st=>st.weight||st.reps).map(st=>`${st.weight||"?"}kg×${st.reps||"?"}`).join(" · ")}</span>
            ${ex.note?`<p style="font-size:11px;color:#666;font-style:italic;margin-top:2px">${ex.note}</p>`:""}
          </div>`).join("")}
      </div>`).join("");
    return `
      <div class="row" style="gap:10px;margin-bottom:1.25rem">
        <button class="btn-icon" onclick="go('home')">&#8592;</button><h2>History</h2>
      </div>
      <div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:1rem">${chips}</div>
      ${filtered.length===0?`<p style="color:#888;font-size:13px">No sessions logged yet.</p>`:rows}`;
  },

  backup(){
    const totalSets=sessions.reduce((a,s)=>a+s.exercises.reduce((b,e)=>b+e.sets.filter(st=>st.weight||st.reps).length,0),0);
    return `
      <div class="row" style="gap:10px;margin-bottom:1.5rem">
        <button class="btn-icon" onclick="go('home')">&#8592;</button><h2>Backup & Restore</h2>
      </div>
      <div class="card" style="margin-bottom:12px">
        <p style="font-weight:500;font-size:14px;margin-bottom:4px">Your data</p>
        <p style="font-size:13px;color:#888">${sessions.length} sessions &nbsp;·&nbsp; ${totalSets} sets logged</p>
      </div>
      <div class="card" style="margin-bottom:12px">
        <p style="font-weight:500;font-size:14px;margin-bottom:6px">Export backup</p>
        <p style="font-size:13px;color:#888;margin-bottom:12px">Downloads a <code>.json</code> file to your phone. Save it to Google Drive or your Files app.</p>
        <button class="btn btn-green" onclick="exportData()">Download backup file</button>
      </div>
      <div class="card">
        <p style="font-weight:500;font-size:14px;margin-bottom:6px">Restore from backup</p>
        <p style="font-size:13px;color:#888;margin-bottom:12px">Pick a previously exported <code>.json</code> file. Sessions will be merged in — nothing overwritten.</p>
        <button class="btn" style="text-align:center" onclick="importData()">Choose backup file</button>
      </div>`;
  },

  progress(){
    const allEx=[...new Set(sessions.flatMap(s=>s.exercises.map(e=>e.name)))];
    const sel=progressEx||(allEx[0]||"");
    if(!allEx.length)return `
      <div class="row" style="gap:10px;margin-bottom:1.25rem">
        <button class="btn-icon" onclick="go('home')">&#8592;</button><h2>Progress</h2>
      </div>
      <p style="color:#888;font-size:13px">Log some sessions first.</p>`;
    const opts=allEx.map(e=>`<option ${e===sel?"selected":""}>${e}</option>`).join("");
    const points=sessions.slice().reverse()
      .filter(s=>s.exercises.some(e=>e.name===sel))
      .map(s=>({date:s.date,best:Math.max(...s.exercises.filter(e=>e.name===sel).flatMap(e=>e.sets.map(st=>parseFloat(st.weight)||0)))}))
      .filter(p=>p.best>0);
    const maxW=points.length?Math.max(...points.map(p=>p.best)):0;
    const W=Math.max(300,points.length*60);
    const chartSvg=points.length>=2?`
      <div class="card" style="overflow-x:auto;padding:16px 12px">
        <svg viewBox="0 0 ${W} 120" style="width:100%;min-width:300px;height:120px;display:block">
          ${points.map((p,i)=>{
            const x=20+i*(W-40)/(points.length-1);
            const y=100-(p.best/maxW)*80;
            const nx=points[i+1]?20+(i+1)*(W-40)/(points.length-1):null;
            const ny=points[i+1]?100-(points[i+1].best/maxW)*80:null;
            return `${nx?`<line x1="${x}" y1="${y}" x2="${nx}" y2="${ny}" stroke="#1D9E75" stroke-width="1.5"/>`:""}
            <circle cx="${x}" cy="${y}" r="4" fill="#1D9E75"/>
            <text x="${x}" y="${y-7}" text-anchor="middle" font-size="9" fill="#888">${p.best}</text>
            <text x="${x}" y="115" text-anchor="middle" font-size="8" fill="#666">${fmt(p.date).slice(0,6)}</text>`;
          }).join("")}
        </svg>
      </div>`:`<p style="color:#888;font-size:13px">Need at least 2 sessions with this exercise to show a chart.</p>`;
    return `
      <div class="row" style="gap:10px;margin-bottom:1.25rem">
        <button class="btn-icon" onclick="go('home')">&#8592;</button><h2>Progress</h2>
      </div>
      <select style="margin-bottom:1.25rem" onchange="progressEx=this.value;render()">${opts}</select>
      ${points.length?`<div class="grid2" style="margin-bottom:1.25rem">
        <div class="metric"><p class="metric-label">All-time PR</p><p class="metric-val">${maxW} <span class="metric-unit">kg</span></p></div>
        <div class="metric"><p class="metric-label">Sessions</p><p class="metric-val">${points.length}</p></div>
      </div>`:""}
      ${chartSvg}`;
  }
};

// ── Actions ────────────────────────────────────────────────────────────────
function go(v){view=v;if(v!=="session")showExPicker=false;render();window.scrollTo(0,0);}
function startSession(day){
  currentSession={id:genId(),day,date:new Date().toISOString(),
    exercises:(PROGRAMME[day]||[]).map(ex=>({id:genId(),name:ex.name,target:ex.target,suggestedWeight:ex.weight,programNote:ex.note,sets:[{weight:"",reps:""}],note:""}))};
  saveCurrent();go("session");
}
function addExerciseToSession(name){
  const ex=getAllExercises().find(e=>e.name===name);
  currentSession.exercises.push({id:genId(),name,target:ex?ex.target:"",suggestedWeight:ex?ex.weight:"",programNote:ex?ex.note:"",sets:[{weight:"",reps:""}],note:""});
  saveCurrent();render();
}
function updateSet(ei,si,field,val){currentSession.exercises[ei].sets[si][field]=val;saveCurrent();}
function addSet(ei){currentSession.exercises[ei].sets.push({weight:"",reps:""});saveCurrent();render();}
function removeSet(ei,si){currentSession.exercises[ei].sets.splice(si,1);saveCurrent();render();}
function removeExercise(ei){currentSession.exercises.splice(ei,1);saveCurrent();render();}
function updateNote(ei,val){currentSession.exercises[ei].note=val;saveCurrent();}
function finishSession(){sessions.unshift(currentSession);save();clearCurrent();currentSession=null;go("home");}
function delSession(id){sessions=sessions.filter(s=>s.id!==id);save();render();}
function setHistFilter(f){historyFilter=f;render();}

render();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
</body>
</html>
